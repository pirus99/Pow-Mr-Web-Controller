version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=change-me-in-production
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:80
      - POWMR_PORT=/dev/ttyUSB0
      - POWMR_BAUDRATE=2400
      - POWMR_SLAVE_ID=5
      - POWMR_TIMEOUT=3
      - SOLAX_METRICS_URL=http://solax-exporter:9090/metrics
      - BATTERY_METRICS_URL=http://battery-exporter:9091/metrics
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
